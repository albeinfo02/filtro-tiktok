<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Che baffo sei?</title>
  <link rel="icon" href="../asset/icona/icona_162.png">
  <style>
    :root { --giallo: #ffd23f; --nero: #111; --carta: #f3eee2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--nero); color: var(--carta);
      font: 600 16px/1.3 system-ui, -apple-system, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; }
    #scena { position: relative; height: min(100%, calc((100vw - 32px) * 16 / 9)); aspect-ratio: 9 / 16; max-height: calc(100vh - 140px); }
    canvas { width: 100%; height: 100%; border-radius: 14px; background: #222; display: block; touch-action: manipulation; }
    #avvio { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; padding: 24px;
      background: var(--giallo); color: var(--nero); border-radius: 14px; }
    #avvio img { width: 140px; margin: 0 auto; border-radius: 28px; }
    #avvio h1 { margin: 0; font-size: 32px; letter-spacing: .02em; }
    button, label.btn { appearance: none; border: 3px solid var(--nero); background: var(--nero); color: var(--giallo);
      font: inherit; font-weight: 800; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
    #comandi { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    #comandi button, #comandi label.btn { background: var(--giallo); color: var(--nero); }
    #comandi button.rec { background: #e53935; color: #fff; border-color: #e53935; }
    #opzioni { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 14px; font-weight: 500; }
    #opzioni input[type=number] { width: 4.5em; }
    #stato { font-size: 13px; opacity: .7; min-height: 1.2em; text-align: center; }
    .nascosto { display: none !important; }
  </style>
</head>
<body>
<main>
  <div id="scena">
    <canvas id="tela" width="720" height="1280"></canvas>
    <div id="avvio">
      <img src="../asset/icona/icona_1024.png" alt="">
      <h1>CHE BAFFO SEI?</h1>
      <p>Anteprima dell'effetto: guarda in camera,<br>tocca lo schermo per fermare la roulette.</p>
      <button id="btnAvvia">Apri la fotocamera</button>
    </div>
  </div>
  <div id="comandi" class="nascosto">
    <button id="btnGira">Gira / Ferma</button>
    <button id="btnRec">● Registra</button>
    <button id="btnCondividi" class="nascosto">⇪ Condividi</button>
    <label class="btn">♪ Canzone<input id="fileAudio" type="file" accept="audio/*" hidden></label>
  </div>
  <div id="opzioni" class="nascosto">
    <label>Stop dopo <input id="optDurata" type="number" min="1" max="30" step="0.5" value="3"> s</label>
    <label>Canzone da <input id="optOffset" type="number" min="0" step="0.1" value="1.4"> s</label>
    <label><input id="optBordo" type="checkbox"> bordino bianco</label>
    <label><input id="optDebug" type="checkbox"> punti viso</label>
  </div>
  <div id="stato"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
